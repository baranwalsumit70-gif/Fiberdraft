<body>
<div class="app">
  <aside class="sidebar" aria-label="Planner">
    <div class="sb-head">
      <div class="brand">
        <div class="brand-mark"><i data-i="network"></i></div>
        <div style="min-width:0"><div class="brand-name">FiberDraft</div><div class="brand-sub">FTTH auto-design</div></div>
      </div>
      <button class="icon-btn" data-act="import" aria-label="Open KML, KMZ or project file" title="Open KML, KMZ or project"><i data-i="folder-open"></i></button>
      <button class="icon-btn" data-act="new" aria-label="New plan" title="New plan"><i data-i="plus"></i></button>
      <button class="icon-btn" data-act="help" aria-label="How it works" title="How it works"><i data-i="circle-help"></i></button>
    </div>
    <div class="sb-tabs">
      <div class="tabs" role="tablist" aria-label="Sections">
        <button class="tab" role="tab" data-act="tab" data-tab="plan" aria-selected="true" aria-controls="panel-plan">Plan</button>
        <button class="tab" role="tab" data-act="tab" data-tab="rules" aria-selected="false" aria-controls="panel-rules">Rules</button>
        <button class="tab" role="tab" data-act="tab" data-tab="results" aria-selected="false" aria-controls="panel-results">Results <span class="dot" hidden></span></button>
      </div>
    </div>
    <div class="sb-body" id="panel-plan" role="tabpanel" aria-label="Plan"></div>
    <div class="sb-body" id="panel-rules" role="tabpanel" aria-label="Rules" hidden></div>
    <div class="sb-body" id="panel-results" role="tabpanel" aria-label="Results" hidden></div>
    <div class="sb-foot" id="foot"></div>
  </aside>
  <main class="mapwrap">
    <div id="map" role="application" aria-label="Map"></div>
    <div class="map-ui mu-top">
      <div class="search" role="search">
        <i data-i="search"></i>
        <input class="input" id="q" type="search" placeholder="Search a place or paste lat, lng" autocomplete="off" aria-label="Search a place">
        <div class="search-res panel" id="qres" hidden></div>
      </div>
      <div class="spacer"></div>
      <div class="base-seg"><div class="seg" id="baseSeg" role="group" aria-label="Base map"></div></div>
    </div>
    <div class="map-ui mu-hint" id="hint" hidden></div>
    <div class="map-ui mu-legend"><div class="panel legend" id="legend"></div></div>
    <div class="map-ui mu-coords" id="coords" aria-hidden="true"></div>
    <div class="map-ui mu-busy" id="busy" hidden><div class="panel busy-card"><i data-i="loader-circle" data-c="spin"></i><span id="busyText">Working…</span></div></div>
    <div class="dropzone" id="dropzone" hidden>Drop a KML, KMZ or FiberDraft project to open it</div>
  </main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog class="modal" id="modal"></dialog>
<input type="file" id="fileKml" accept=".kml,.kmz,.json" hidden>
